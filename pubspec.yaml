name: teolearn
description: TeoLearn — A Teochew language learning app for kids. Learn Teochew, Cantonese, Mandarin, and English through fun swipe flashcards!
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  sqflite: ^2.4.0
  path: ^1.9.0
  appinio_swiper: ^2.1.1
  confetti: ^0.8.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/teochew/
    - assets/audio/teochew/audio_mapping.json
